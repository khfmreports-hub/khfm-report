<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHFM Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16232E;
    --paper:#F1EEE4;
    --surface:#FFFFFF;
    --accent:#C4571F;
    --accent-ink:#5A2610;
    --steel:#66727E;
    --line:#D9D3C1;
    --profit:#2F6E4E;
    --loss:#A6342E;
    --profit-bg:#E4EEE6;
    --loss-bg:#F3E4E1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .disp{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.02em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  input,select{
    font-family:'IBM Plex Mono',monospace;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:10px 10px;
    border-radius:3px;
    font-size:15px;
    width:100%;
    min-width:90px;
  }
  input[type=number]{
    font-size:16px;
    padding:12px 10px;
    min-width:100px;
  }
  select{font-family:'IBM Plex Sans',sans-serif;}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:500;
    cursor:pointer;
    border-radius:3px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:8px 14px;
    font-size:13px;
  }
  button:hover{border-color:var(--steel);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#FCF3EC;}
  button.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
  button.ghost{border-color:transparent;background:transparent;color:var(--steel);}
  button.danger{color:var(--loss);}
  table{border-collapse:collapse;width:100%;}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;}
  th{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);border-bottom:2px solid var(--ink);}
  td.num, th.num{text-align:right;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:2px;font-weight:500;}
  .badge.sitewise{background:#DDE6EC;color:#2A4A5E;}
  .badge.private{background:#EEE3D6;color:#6B4A1E;}
  .badge.role{background:rgba(196,87,31,0.15);color:var(--accent-ink);}
</style>
</head>
<body>

<div id="gate" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);position:relative;padding:40px 32px;">
    <div style="position:absolute;top:-1px;left:-1px;width:16px;height:16px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);"></div>
    <div style="position:absolute;top:-1px;right:-1px;width:16px;height:16px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);"></div>
    <div style="position:absolute;bottom:-1px;left:-1px;width:16px;height:16px;border-bottom:2px solid var(--accent);border-left:2px solid var(--accent);"></div>
    <div style="position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);"></div>
    <p class="mono" style="font-size:11px;letter-spacing:.15em;color:var(--steel);margin:0 0 4px;text-transform:uppercase;">Application</p>
    <h1 class="disp" style="font-size:30px;margin:0 0 24px;">KHFM Report</h1>
    <input type="password" id="pw-input" placeholder="Enter password" style="margin-bottom:12px;">
    <button class="primary" style="width:100%;" onclick="tryUnlock()">Login</button>
    <p id="pw-error" class="mono" style="color:var(--loss);font-size:12px;margin:12px 0 0;display:none;">Incorrect password. Try again.</p>
  </div>
</div>

<div id="app" style="display:none;">
  <div style="display:flex;min-height:100vh;">
    <nav id="nav" style="width:200px;flex-shrink:0;background:var(--ink);color:#EDE7D9;padding:24px 0;"></nav>
    <main style="flex:1;padding:32px 40px;max-width:1200px;">
      <div id="page"></div>
    </main>
  </div>
</div>

<script>
const SECTIONS = [
  {id:'dashboard', label:'Dashboard'},
  {id:'site_master', label:'Site master'},
  {id:'salary', label:'Salary'},
  {id:'profit_loss', label:'Profit / loss'},
  {id:'vendor_expenses', label:'Vendor expenses'},
  {id:'pf_esic', label:'PF / ESIC'},
  {id:'labour_strength', label:'Labour strength'},
  {id:'billing', label:'Billing'},
  {id:'special_expenses', label:'Other expenses'},
  {id:'subcontractor_pl', label:'Subcontractor P/L'},
];

const MONTHS = ['jan','feb','march','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const MONTH_LABELS = {jan:'Jan',feb:'Feb',march:'Mar',apr:'Apr',may:'May',jun:'Jun',jul:'Jul',aug:'Aug',sep:'Sep',oct:'Oct',nov:'Nov',dec:'Dec'};

const SIMPLE_METRICS = {
  salary: {label:'Monthly salary', unit:'currency'},
  profit_loss: {label:'Profit / loss', unit:'currency'},
  vendor_expenses: {label:'Vendor expenses', unit:'currency'},
  pf_esic: {label:'PF / ESIC amount', unit:'currency'},
  labour_strength: {label:'Labour strength', unit:'number'},
  billing: {label:'Billing', unit:'currency'},
  special_expenses: {label:'Other expenses', unit:'currency'},
};

let token = sessionStorage.getItem('khfm-token') || null;
let state = null;
let currentProfile = null;
let currentSection = null;
let saveTimer = null;

function uid(){ return Math.random().toString(36).slice(2,10); }

async function api(path, options){
  options = options || {};
  options.headers = Object.assign({'Content-Type':'application/json'}, options.headers||{}, token?{'Authorization':'Bearer '+token}:{});
  const res = await fetch(path, options);
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ throw new Error(data.error || ('Request failed ('+res.status+')')); }
  return data;
}

async function tryUnlock(){
  const input = document.getElementById('pw-input').value;
  const errEl = document.getElementById('pw-error');
  errEl.style.display='none';
  try{
    const result = await api('/api/login', {method:'POST', body: JSON.stringify({password: input})});
    token = result.token;
    sessionStorage.setItem('khfm-token', token);
    currentProfile = result.profile;
    await loadState();
    currentSection = currentProfile.sections[0];
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    renderNav();
    renderPage();
  }catch(e){
    errEl.textContent = e.message || 'Incorrect password. Try again.';
    errEl.style.display='block';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });

async function loadState(){
  const result = await api('/api/state');
  state = Object.assign({sites: result.sites}, result.sections);
  state.canEditSites = result.canEditSites;
}

function logout(){
  sessionStorage.removeItem('khfm-token');
  token = null; currentProfile = null; state = null; currentSection = null;
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='flex';
  document.getElementById('pw-input').value='';
}

function queueSaveSection(key){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await api('/api/state/section', {method:'POST', body: JSON.stringify({key, value: state[key]})}); }
    catch(e){ alert('Could not save: '+e.message); }
  }, 400);
}
function queueSaveSites(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await api('/api/state/sites', {method:'POST', body: JSON.stringify({sites: state.sites})}); }
    catch(e){ alert('Could not save: '+e.message); }
  }, 400);
}

async function manageLogins(){
  if(currentProfile.id!=='admin'){ alert('Only the full-access login can manage passwords.'); return; }
  const page = document.getElementById('page');
  let profiles;
  try{ profiles = await api('/api/admin/profiles'); }
  catch(e){ alert(e.message); return; }
  page.innerHTML = `
    <h2 class="disp" style="font-size:26px;margin:0 0 4px;">Manage logins</h2>
    <p style="color:var(--steel);font-size:13px;margin:0 0 24px;">Set a new password for any login. Each login only sees the sections listed below it.</p>
    ${profiles.map(p=>`
      <div style="background:var(--surface);border:1px solid var(--line);padding:16px 20px;margin-bottom:12px;">
        <p style="font-weight:600;margin:0 0 4px;">${p.label}</p>
        <p style="color:var(--steel);font-size:12px;margin:0 0 12px;">Sees: ${p.sections.map(id=>{const s=SECTIONS.find(x=>x.id===id); return s?s.label:id;}).join(', ')}</p>
        <div style="display:flex;gap:8px;max-width:360px;">
          <input type="password" id="np-${p.id}" placeholder="New password">
          <button onclick="setLoginPassword('${p.id}')" style="flex-shrink:0;">Save</button>
        </div>
      </div>
    `).join('')}
  `;
}
async function setLoginPassword(profileId){
  const input = document.getElementById('np-'+profileId);
  if(!input.value) return;
  try{
    await api('/api/admin/set-password', {method:'POST', body: JSON.stringify({profileId, password: input.value})});
    input.value='';
    alert('Password updated.');
  }catch(e){ alert(e.message); }
}

function renderNav(){
  const nav = document.getElementById('nav');
  const visible = currentProfile.sections;
  nav.innerHTML = `
    <div style="padding:0 20px 20px;border-bottom:1px solid #2C3B47;margin-bottom:12px;">
      <p class="disp" style="font-size:22px;margin:0;color:#F1EEE4;">KHFM<br>Report</p>
      <span class="badge role" style="margin-top:8px;">${currentProfile.label}</span>
    </div>
    ${SECTIONS.filter(s=>visible.includes(s.id)).map(s=>`
      <div onclick="goTo('${s.id}')" style="padding:10px 20px;cursor:pointer;font-size:14px;
        border-left:3px solid ${currentSection===s.id?'var(--accent)':'transparent'};
        background:${currentSection===s.id?'rgba(196,87,31,0.15)':'transparent'};
        color:${currentSection===s.id?'#FCF3EC':'#B9C1C7'};">${s.label}</div>
    `).join('')}
    <div style="padding:20px;margin-top:16px;border-top:1px solid #2C3B47;display:flex;flex-direction:column;gap:8px;align-items:flex-start;">
      ${currentProfile.id==='admin' ? `<button class="ghost" style="color:#8C979E;padding:0;font-size:12px;" onclick="manageLogins()">Manage logins</button>` : ''}
      <button class="ghost" style="color:#8C979E;padding:0;font-size:12px;" onclick="logout()">Log out</button>
    </div>
  `;
}
function goTo(id){ currentSection = id; renderNav(); renderPage(); }

function fmtCurrency(n){
  n = Math.round(n||0);
  const neg = n<0;
  const abs = Math.abs(n).toLocaleString('en-IN');
  return (neg?'(':'')+'\u20B9'+abs+(neg?')':'');
}
function fmtNum(n){ return Math.round(n||0).toLocaleString('en-IN'); }
function totalOf(entry){ if(!entry) return 0; return MONTHS.reduce((sum,m)=>sum+(entry[m]||0),0); }

function renderPage(){
  const page = document.getElementById('page');
  if(currentSection==='dashboard') return renderDashboard(page);
  if(currentSection==='site_master') return renderSiteMaster(page);
  if(currentSection==='subcontractor_pl') return renderSubcontractor(page);
  return renderMetricPage(page, currentSection);
}

function renderMetricPage(page, key){
  const meta = SIMPLE_METRICS[key];
  const data = state[key] || {};
  const isCurrency = meta.unit==='currency';
  page.innerHTML = `
    <h2 class="disp" style="font-size:26px;margin:0 0 4px;">${meta.label}</h2>
    <p style="color:var(--steel);font-size:13px;margin:0 0 24px;">January to December 2026, per site. Values save automatically.</p>
    <div style="overflow-x:auto;">
    <table style="min-width:1550px;">
      <tr><th>Site</th>${MONTHS.map(m=>`<th class="num">${MONTH_LABELS[m]}</th>`).join('')}<th class="num">2026 total</th></tr>
      ${state.sites.map(site=>{
        const e = data[site.id] || {};
        return `<tr>
          <td>${site.name}</td>
          ${MONTHS.map(m=>`<td class="num"><input type="number" value="${e[m]||''}" oninput="updateMetric('${key}','${site.id}','${m}',this.value)"></td>`).join('')}
          <td class="num mono" id="total-${key}-${site.id}">${isCurrency?fmtCurrency(totalOf(e)):fmtNum(totalOf(e))}</td>
        </tr>`;
      }).join('')}
      ${state.sites.length===0?`<tr><td colspan="${MONTHS.length+2}" style="color:var(--steel);">No sites available yet.</td></tr>`:''}
    </table>
    </div>
  `;
}
function updateMetric(key, siteId, month, value){
  if(!state[key]) state[key] = {};
  if(!state[key][siteId]) state[key][siteId] = {};
  state[key][siteId][month] = parseFloat(value)||0;
  queueSaveSection(key);
  const meta = SIMPLE_METRICS[key];
  const cell = document.getElementById('total-'+key+'-'+siteId);
  if(cell){
    const total = totalOf(state[key][siteId]);
    cell.textContent = meta.unit==='currency' ? fmtCurrency(total) : fmtNum(total);
  }
}
function renderPageQuiet(){
  const scrollY = window.scrollY;
  renderPage();
  window.scrollTo(0, scrollY);
}

function renderSiteMaster(page){
  page.innerHTML = `
    <h2 class="disp" style="font-size:26px;margin:0 0 4px;">Site master</h2>
    <p style="color:var(--steel);font-size:13px;margin:0 0 24px;">Every site lives here once. Other tabs reference these sites automatically.</p>
    <table>
      <tr><th>Name</th><th>Type</th><th>Location</th><th>In-charge</th><th></th></tr>
      ${state.sites.map(site=>`
        <tr>
          <td><input value="${site.name}" oninput="updateSite('${site.id}','name',this.value)"></td>
          <td>
            <select onchange="updateSite('${site.id}','type',this.value)">
              <option ${site.type==='Tender'?'selected':''}>Tender</option>
              <option ${site.type==='Private'?'selected':''}>Private</option>
            </select>
          </td>
          <td><input value="${site.location||''}" oninput="updateSite('${site.id}','location',this.value)"></td>
          <td><input value="${site.incharge||''}" oninput="updateSite('${site.id}','incharge',this.value)"></td>
          <td><button class="danger ghost" onclick="removeSite('${site.id}')">Remove</button></td>
        </tr>
      `).join('')}
    </table>
    <button style="margin-top:16px;" onclick="addSite()">+ Add site</button>
  `;
}
function addSite(){
  state.sites.push({id:uid(), name:'New site', type:'Tender', location:'', incharge:''});
  queueSaveSites(); renderPage();
}
function updateSite(id, field, value){
  const site = state.sites.find(s=>s.id===id);
  if(site) site[field]=value;
  queueSaveSites();
}
function removeSite(id){
  if(!confirm('Remove this site? Its entries in other tabs will stay but no longer show here.')) return;
  state.sites = state.sites.filter(s=>s.id!==id);
  queueSaveSites(); renderPage();
}

function renderSubcontractor(page){
  const rows = state.subcontractor_pl || [];
  page.innerHTML = `
    <h2 class="disp" style="font-size:26px;margin:0 0 4px;">Subcontractor P/L</h2>
    <p style="color:var(--steel);font-size:13px;margin:0 0 24px;">One row per subcontractor per site, January to December 2026.</p>
    <div style="overflow-x:auto;">
    <table style="min-width:1750px;">
      <tr><th>Site</th><th>Subcontractor</th>${MONTHS.map(m=>`<th class="num">${MONTH_LABELS[m]}</th>`).join('')}<th class="num">2026 total</th><th></th></tr>
      ${rows.map(r=>`
        <tr>
          <td>
            <select onchange="updateSub('${r.id}','siteId',this.value)">
              ${state.sites.map(s=>`<option value="${s.id}" ${s.id===r.siteId?'selected':''}>${s.name}</option>`).join('')}
            </select>
          </td>
          <td><input value="${r.name}" oninput="updateSub('${r.id}','name',this.value)"></td>
          ${MONTHS.map(m=>`<td class="num"><input type="number" value="${r[m]||''}" oninput="updateSub('${r.id}','${m}',this.value)"></td>`).join('')}
          <td class="num mono" id="subtotal-${r.id}">${fmtCurrency(totalOf(r))}</td>
          <td><button class="danger ghost" onclick="removeSub('${r.id}')">Remove</button></td>
        </tr>
      `).join('')}
      ${rows.length===0?`<tr><td colspan="${MONTHS.length+4}" style="color:var(--steel);">No subcontractor entries yet.</td></tr>`:''}
    </table>
    </div>
    <button style="margin-top:16px;" onclick="addSub()">+ Add subcontractor entry</button>
  `;
}
function addSub(){
  if(state.sites.length===0){ alert('No sites available.'); return; }
  if(!state.subcontractor_pl) state.subcontractor_pl = [];
  state.subcontractor_pl.push({id:uid(), siteId:state.sites[0].id, name:'New subcontractor'});
  queueSaveSection('subcontractor_pl'); renderPage();
}
function updateSub(id, field, value){
  const row = (state.subcontractor_pl||[]).find(r=>r.id===id);
  if(!row) return;
  row[field] = MONTHS.includes(field) ? (parseFloat(value)||0) : value;
  queueSaveSection('subcontractor_pl');
  const cell = document.getElementById('subtotal-'+id);
  if(cell) cell.textContent = fmtCurrency(totalOf(row));
}
function removeSub(id){
  state.subcontractor_pl = (state.subcontractor_pl||[]).filter(r=>r.id!==id);
  queueSaveSection('subcontractor_pl'); renderPage();
}

function renderDashboard(page){
  const rows = state.sites.map(site=>{
    const salary = totalOf((state.salary||{})[site.id]);
    const pl = totalOf((state.profit_loss||{})[site.id]);
    const vendor = totalOf((state.vendor_expenses||{})[site.id]);
    const pf = totalOf((state.pf_esic||{})[site.id]);
    const labour = (state.labour_strength||{})[site.id];
    const avgLabour = labour ? totalOf(labour)/MONTHS.length : 0;
    const billing = totalOf((state.billing||{})[site.id]);
    const special = totalOf((state.special_expenses||{})[site.id]);
    const subPl = (state.subcontractor_pl||[]).filter(r=>r.siteId===site.id).reduce((sum,r)=>sum+totalOf(r),0);
    const net = billing - salary - vendor - pf - special + subPl;
    return {site, salary, pl, vendor, pf, avgLabour, billing, special, subPl, net};
  });
  const totals = rows.reduce((a,r)=>({
    salary:a.salary+r.salary, pl:a.pl+r.pl, vendor:a.vendor+r.vendor, pf:a.pf+r.pf,
    billing:a.billing+r.billing, special:a.special+r.special, subPl:a.subPl+r.subPl, net:a.net+r.net
  }), {salary:0,pl:0,vendor:0,pf:0,billing:0,special:0,subPl:0,net:0});

  page.innerHTML = `
    <h2 class="disp" style="font-size:26px;margin:0 0 4px;">Dashboard</h2>
    <p style="color:var(--steel);font-size:13px;margin:0 0 24px;">2026 full-year (Jan-Dec) summary across all sites, computed live.</p>
    <div style="position:relative;border:1px solid var(--line);padding:8px;overflow-x:auto;">
      <div style="position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);"></div>
      <div style="position:absolute;top:-1px;right:-1px;width:14px;height:14px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);"></div>
      <div style="position:absolute;bottom:-1px;left:-1px;width:14px;height:14px;border-bottom:2px solid var(--accent);border-left:2px solid var(--accent);"></div>
      <div style="position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);"></div>
      <table style="min-width:1000px;">
        <tr>
          <th>Site</th><th>Type</th><th class="num">Salary</th><th class="num">P/L (reported)</th>
          <th class="num">Vendor</th><th class="num">PF/ESIC</th><th class="num">Avg labour</th>
          <th class="num">Billing</th><th class="num">Special</th><th class="num">Subcontractor P/L</th><th class="num">Net</th>
        </tr>
        ${rows.map(r=>`
          <tr>
            <td>${r.site.name}</td>
            <td><span class="badge ${r.site.type==='Private'?'private':'sitewise'}">${r.site.type}</span></td>
            <td class="num mono">${fmtCurrency(r.salary)}</td>
            <td class="num mono">${fmtCurrency(r.pl)}</td>
            <td class="num mono">${fmtCurrency(r.vendor)}</td>
            <td class="num mono">${fmtCurrency(r.pf)}</td>
            <td class="num mono">${fmtNum(r.avgLabour)}</td>
            <td class="num mono">${fmtCurrency(r.billing)}</td>
            <td class="num mono">${fmtCurrency(r.special)}</td>
            <td class="num mono">${fmtCurrency(r.subPl)}</td>
            <td class="num mono" style="font-weight:600;background:${r.net>=0?'var(--profit-bg)':'var(--loss-bg)'};color:${r.net>=0?'var(--profit)':'var(--loss)'};">${fmtCurrency(r.net)}</td>
          </tr>
        `).join('')}
        ${rows.length===0?'<tr><td colspan="11" style="color:var(--steel);">Add sites in Site master to see the dashboard.</td></tr>':''}
        <tr style="font-weight:600;">
          <td>Grand total</td><td></td>
          <td class="num mono">${fmtCurrency(totals.salary)}</td>
          <td class="num mono">${fmtCurrency(totals.pl)}</td>
          <td class="num mono">${fmtCurrency(totals.vendor)}</td>
          <td class="num mono">${fmtCurrency(totals.pf)}</td>
          <td></td>
          <td class="num mono">${fmtCurrency(totals.billing)}</td>
          <td class="num mono">${fmtCurrency(totals.special)}</td>
          <td class="num mono">${fmtCurrency(totals.subPl)}</td>
          <td class="num mono">${fmtCurrency(totals.net)}</td>
        </tr>
      </table>
    </div>
  `;
}

sessionStorage.removeItem('khfm-token');
token = null;
</script>
</body>
</html>
